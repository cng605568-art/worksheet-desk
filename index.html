<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Worksheet Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--tx:#14213d;--mu:#5b6578;--bd:#cfd7e3;--ac:#14213d;--act:#fff;--hl:#ffd23f;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;--wn:#92400e;--wnb:#fef3c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1824;--card:#16253a;--tx:#e8eef5;--mu:#9fb0c6;--bd:#2b3d57;--ac:#ffd23f;--act:#14213d;--ok:#86efac;--okb:#14391f;--bad:#fca5a5;--badb:#4a1d1d;--wn:#fcd34d;--wnb:#4a3411}}
:root[data-theme="dark"]{--bg:#0d1824;--card:#16253a;--tx:#e8eef5;--mu:#9fb0c6;--bd:#2b3d57;--ac:#ffd23f;--act:#14213d;--ok:#86efac;--okb:#14391f;--bad:#fca5a5;--badb:#4a1d1d;--wn:#fcd34d;--wnb:#4a3411}
select{width:100%;max-width:300px;background:var(--bg);border:2px solid var(--bd);border-radius:8px;padding:10px;min-height:44px;font:inherit;color:inherit}
*,*:before,*:after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif;background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
header{background:var(--card);border-bottom:2px solid var(--tx);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:860px;margin:auto;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;margin-right:auto}
nav{display:flex;gap:6px;overflow-x:auto;width:100%;order:3}
nav button{flex:1;white-space:nowrap}
main{max-width:860px;margin:auto;padding:16px 14px 60px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--tx);background:var(--card);border-radius:8px;padding:9px 14px;min-height:44px}
button.tab[aria-selected=true]{background:var(--hl);color:#14213d;font-weight:700}
button.pri{background:var(--ac);color:var(--act);font-weight:700}
button.sm{min-height:36px;padding:4px 10px;font-size:15px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--tx);border-radius:10px;padding:16px;margin:0 0 14px;box-shadow:4px 4px 0 var(--tx)}
h1{font-size:26px;margin:4px 0 14px}h2{font-size:20px;margin:0 0 8px}
.mu{color:var(--mu);font-size:15px}
input[type=text],input[type=number],input[type=password],textarea{width:100%;background:var(--bg);border:2px solid var(--bd);border-radius:8px;padding:10px;min-height:44px}
textarea{min-height:100px;resize:vertical}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:2px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
.opt input[type=radio]{width:22px;height:22px;accent-color:var(--tx);flex:none}
.opt:has(input:checked){border-color:var(--tx);background:var(--hl);color:#14213d}
.opt.edit{cursor:default}.opt.edit input[type=text]{border:0;padding:4px;min-height:32px;background:transparent}
.q{font-weight:700;margin:0 0 10px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:14px;font-weight:700}
.b-p{background:var(--wnb);color:var(--wn)}.b-m{background:var(--okb);color:var(--ok)}
.drop{border:3px dashed var(--tx);border-radius:12px;padding:36px 16px;text-align:center;background:var(--card)}
.drop.over{background:var(--hl);color:#14213d}
.spin{width:44px;height:44px;border:5px solid var(--bd);border-top-color:var(--tx);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation-duration:4s}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;margin:0 0 10px;padding:14px;box-shadow:3px 3px 0 var(--tx)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.cmp{grid-template-columns:1fr}}
.cell{border-radius:8px;padding:10px;border:2px solid var(--bd);white-space:pre-wrap;overflow-wrap:anywhere}
.cell.good{background:var(--okb);border-color:var(--ok)}.cell.bad{background:var(--badb);border-color:var(--bad)}
.cell b{display:block;font-size:14px;color:var(--mu)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(10,18,30,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .card{max-width:380px;text-align:center;margin:0}
.tick{font-size:48px}
.toast{max-width:90vw;text-align:center;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:30}
</style></head><body>
<header><div class="bar"><span class="logo">✏️ Worksheet Desk</span><span id="who" class="mu"></span><button id="so" class="sm" hidden onclick="signOut('Signed out')">Sign out</button><button id="th" class="sm" aria-label="Toggle light or dark theme">Dark mode</button></div></header>
<main id="app"></main><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}};
const S={token:ss.get('wds_t')||'',user:null,mode:'login',pub:[],done:{},loaded:false,err:'',cur:null,A:{}};
try{S.user=JSON.parse(ss.get('wds_u')||'null')}catch(e){}
if(!S.user||S.user.role!=='student')S.token='',S.user=null;
let LAST=Date.now();
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),4500)}
$('#th').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';$('#th').textContent=dark?'Dark mode':'Light mode'};
async function post(a,payload){const r=await fetch('/api/server?a='+a,{method:'POST',headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:JSON.stringify(payload||{}),cache:'no-store'});
const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&S.token)signOut('Please sign in again.');throw Error(j.error||'Request failed')}return j}
function signOut(msg){S.token='';S.user=null;S.pub=[];S.done={};S.loaded=false;S.cur=null;S.A={};S.mode='login';ss.set('wds_t',null);ss.set('wds_u',null);render();scrollTo(0,0);if(msg)toast(msg)}
const f=(id,l,t,ac,x)=>`<label class="q" for="${id}" style="display:block;margin-top:12px">${l}</label><input type="${t}" id="${id}" autocomplete="${ac}" ${x||''}>`;
function authView(){const c=S.mode==='create';
return`<div class="card"><h1>${c?'Create your account':'Sign in'}</h1><p class="mu">${c?'Use your real name so your teacher knows who you are.':'Sign in with your worksheet account to see your worksheets.'}</p>`+
(c?f('an','Your name','text','name'):'')+f('au','Username','text','username','autocapitalize="none" spellcheck="false"')+f('ap','Password'+(c?' (6+ characters)':''),'password',c?'new-password':'current-password')+(c?f('ap2','Confirm password','password','new-password'):'')+
`<div class="actions" style="margin-top:14px"><button class="pri" id="ab" onclick="auth()">${c?'Create account':'Sign in'}</button><button onclick="S.mode='${c?'login':'create'}';render()">${c?'I already have an account':'Create an account'}</button></div><p class="mu" style="margin-top:12px">Forgot your password? Ask your teacher to reset it.</p></div>`}
async function auth(){const c=S.mode==='create',un=$('#au').value.trim(),pw=$('#ap').value;
if(!un||!pw){toast('Enter your username and password');return}
if(c){if(!$('#an').value.trim()){toast('Enter your name');return}if(pw!==$('#ap2').value){toast('The two passwords do not match');return}}
const b=$('#ab');b.disabled=true;
try{const j=await post(c?'register':'login',c?{role:'student',name:$('#an').value,username:un,password:pw}:{as:'student',username:un,password:pw});
S.token=j.token;S.user=j.user;ss.set('wds_t',j.token);ss.set('wds_u',JSON.stringify(j.user));LAST=Date.now();S.loaded=false;render();load()}
catch(e){toast(e.message==='Failed to fetch'?'No connection. Try again.':e.message);const bb=$('#ab');if(bb)bb.disabled=false}}
addEventListener('keydown',e=>{LAST=Date.now();if(e.key==='Enter'&&['an','au','ap','ap2'].includes(e.target.id))auth()});
addEventListener('pointerdown',()=>{LAST=Date.now()});
async function load(manual){if(!S.token)return;try{const j=await post('worksheets');S.pub=j.worksheets||[];S.done={};(j.done||[]).forEach(id=>S.done[id]=1);S.err=''}
catch(e){if(!S.token)return;S.err=e.message==='Failed to fetch'?'Cannot reach the server. Check your internet and try again.':e.message}
S.loaded=true;if(S.cur&&!S.pub.find(x=>x.id===S.cur))S.cur=null;if(!S.cur)render();if(manual&&!S.err)toast('Updated')}
function render(){$('#who').textContent=S.user?S.user.name:'';$('#so').hidden=!S.user;$('#app').innerHTML=student();
document.querySelectorAll('#app .q,#app textarea,#app .opt').forEach(e=>e.setAttribute('dir','auto'))}
function student(){if(!S.token)return authView();
if(!S.loaded)return'<div class="card" role="status"><h2>Loading worksheets…</h2></div>';
if(S.err&&!S.pub.length)return`<div class="card"><h1>No connection</h1><p>${esc(S.err)}</p><button class="pri" onclick="load(true)">Try again</button></div>`;
const n=S.pub.length;if(!n)return'<div class="card"><h1>No worksheets yet</h1><p>Your teacher hasn\'t published a worksheet yet. Check back soon.</p><button class="pri" onclick="load(true)">Refresh</button></div>';
const w=S.pub.find(x=>x.id===S.cur);
if(!w)return`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>Choose a worksheet</h1><button class="sm" onclick="load(true)">Refresh</button></div><p class="mu" style="margin-top:-8px">${n} worksheet${n>1?'s':''} available</p>`+S.pub.map(x=>{const mc=x.q.filter(q=>q.t==='mc').length;
return`<button class="row card" onclick="openWs(${x.id})"><span><b>${esc(x.title)}</b><br><span class="mu">${x.q.length} question${x.q.length>1?'s':''} · ${mc} multiple choice · ${x.q.length-mc} written</span></span><span class="badge ${S.done[x.id]?'b-m':'b-p'}">${S.done[x.id]?'Submitted':'Start'}</span></button>`}).join('');
return`<button class="sm" onclick="S.cur=null;S.A={};render()" style="margin-bottom:10px">← All worksheets</button><h1>${esc(w.title)}</h1><p class="mu" style="margin-top:-8px">Submitting as <b>${esc(S.user.name)}</b></p>`+
w.q.map((q,i)=>`<div class="card"><p class="q">${i+1}. ${esc(q.q)}</p>`+(q.t==='mc'?q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" ${S.A[i]===j?'checked':''} onchange="S.A[${i}]=${j}"> ${esc(o)}</label>`).join(''):`<textarea aria-label="Answer to question ${i+1}" placeholder="Type your answer here" oninput="S.A[${i}]=this.value">${esc(S.A[i]||'')}</textarea>`)+'</div>').join('')+
'<button class="pri" id="sb" style="width:100%" onclick="submitWs()">Submit worksheet</button>'}
function openWs(id){S.cur=id;S.A={};render();scrollTo(0,0)}
async function submitWs(){const w=S.pub.find(x=>x.id===S.cur);if(!w)return;const b=$('#sb');b.disabled=true;b.textContent='Sending…';
try{await post('submit',{wid:w.id,ans:S.A});
S.done[S.cur]=1;S.cur=null;S.A={};render();
$('#ov').innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="card"><div class="tick">✅</div><h2 id="mt">Submitted successfully</h2><p class="mu">Your teacher can now see your answers.</p><button class="pri" id="okb">Done</button></div></div>';
$('#okb').focus();$('#okb').onclick=()=>{$('#ov').innerHTML=''}}
catch(e){if(!S.token)return;toast(e.message==='Failed to fetch'?'No connection. Your answers are still here. Try again.':e.message);b.disabled=false;b.textContent='Submit worksheet'}}
setInterval(()=>{if(S.token&&Date.now()-LAST>12e5)signOut('Signed out after 20 minutes of inactivity')},15000);
setInterval(()=>{if(S.token&&S.loaded&&!document.hidden&&!S.cur)load()},30000);
render();if(S.token)load();
</script></body></html>
