<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Worksheet Desk · Teacher</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--tx:#14213d;--mu:#5b6578;--bd:#cfd7e3;--ac:#14213d;--act:#fff;--hl:#ffd23f;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;--wn:#92400e;--wnb:#fef3c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1824;--card:#16253a;--tx:#e8eef5;--mu:#9fb0c6;--bd:#2b3d57;--ac:#ffd23f;--act:#14213d;--ok:#86efac;--okb:#14391f;--bad:#fca5a5;--badb:#4a1d1d;--wn:#fcd34d;--wnb:#4a3411}}
:root[data-theme="dark"]{--bg:#0d1824;--card:#16253a;--tx:#e8eef5;--mu:#9fb0c6;--bd:#2b3d57;--ac:#ffd23f;--act:#14213d;--ok:#86efac;--okb:#14391f;--bad:#fca5a5;--badb:#4a1d1d;--wn:#fcd34d;--wnb:#4a3411}
select{width:100%;max-width:300px;background:var(--bg);border:2px solid var(--bd);border-radius:8px;padding:10px;min-height:44px;font:inherit;color:inherit}
*,*:before,*:after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif;background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
header{background:var(--card);border-bottom:2px solid var(--tx);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:860px;margin:auto;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;margin-right:auto}
nav{display:flex;gap:6px;overflow-x:auto;width:100%;order:3}
nav button{flex:1;white-space:nowrap}
main{max-width:860px;margin:auto;padding:16px 14px 60px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--tx);background:var(--card);border-radius:8px;padding:9px 14px;min-height:44px}
button.tab[aria-selected=true]{background:var(--hl);color:#14213d;font-weight:700}
button.pri{background:var(--ac);color:var(--act);font-weight:700}
button.sm{min-height:36px;padding:4px 10px;font-size:15px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--tx);border-radius:10px;padding:16px;margin:0 0 14px;box-shadow:4px 4px 0 var(--tx)}
h1{font-size:26px;margin:4px 0 14px}h2{font-size:20px;margin:0 0 8px}
.mu{color:var(--mu);font-size:15px}
input[type=text],input[type=number],input[type=password],textarea{width:100%;background:var(--bg);border:2px solid var(--bd);border-radius:8px;padding:10px;min-height:44px}
textarea{min-height:100px;resize:vertical}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:2px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
.opt input[type=radio]{width:22px;height:22px;accent-color:var(--tx);flex:none}
.opt:has(input:checked){border-color:var(--tx);background:var(--hl);color:#14213d}
.needs-answer{border-color:#c2410c!important;box-shadow:4px 4px 0 #c2410c!important}
.answer-warning{color:#9a3412;background:#ffedd5;padding:10px;border-radius:8px;font-weight:700;margin:8px 0}
.opt.edit{cursor:default}.opt.edit input[type=text]{border:0;padding:4px;min-height:32px;background:transparent}
.q{font-weight:700;margin:0 0 10px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:14px;font-weight:700}
.b-p{background:var(--wnb);color:var(--wn)}.b-m{background:var(--okb);color:var(--ok)}
.drop{border:3px dashed var(--tx);border-radius:12px;padding:36px 16px;text-align:center;background:var(--card)}
.drop.over{background:var(--hl);color:#14213d}
.spin{width:44px;height:44px;border:5px solid var(--bd);border-top-color:var(--tx);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation-duration:4s}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;margin:0 0 10px;padding:14px;box-shadow:3px 3px 0 var(--tx)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.cmp{grid-template-columns:1fr}}
.cell{border-radius:8px;padding:10px;border:2px solid var(--bd);white-space:pre-wrap;overflow-wrap:anywhere}
.cell.good{background:var(--okb);border-color:var(--ok)}.cell.bad{background:var(--badb);border-color:var(--bad)}
.cell b{display:block;font-size:14px;color:var(--mu)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(10,18,30,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .card{max-width:380px;text-align:center;margin:0}
.tick{font-size:48px}
.toast{max-width:90vw;text-align:center;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:30}

/* Worksheet Desk refresh: cleaner, calmer, mobile-first styling */
:root{--bg:#f4f7fb;--card:#ffffff;--tx:#17243b;--mu:#68758b;--bd:#dce4ef;--ac:#2463eb;--act:#ffffff;--hl:#e4edff;--ok:#16794a;--okb:#e3f7eb;--bad:#b42318;--badb:#fff0ef;--wn:#875900;--wnb:#fff4d6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#121d30;--tx:#e8eef9;--mu:#a7b5ca;--bd:#29374d;--ac:#84aaff;--act:#102044;--hl:#243b64;--ok:#8ee2ac;--okb:#183b2c;--bad:#ffaaa4;--badb:#472321;--wn:#ffdc7b;--wnb:#3d321b}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#121d30;--tx:#e8eef9;--mu:#a7b5ca;--bd:#29374d;--ac:#84aaff;--act:#102044;--hl:#243b64;--ok:#8ee2ac;--okb:#183b2c;--bad:#ffaaa4;--badb:#472321;--wn:#ffdc7b;--wnb:#3d321b}
body{background:radial-gradient(ellipse at top left,rgba(36,99,235,.07),transparent 45%),var(--bg);background-image:radial-gradient(ellipse at top left,rgba(36,99,235,.07),transparent 45%);background-attachment:fixed}
header{border-bottom:1px solid var(--bd);box-shadow:0 5px 24px rgba(20,35,60,.06)}
.bar{padding-top:13px;padding-bottom:13px}
.logo{letter-spacing:-.35px}
nav{padding-top:3px}
button{border:1px solid var(--bd);border-radius:12px;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
button:hover{border-color:var(--ac);box-shadow:0 4px 12px rgba(28,60,110,.08)}
button:active{transform:translateY(1px)}
button.pri{background:var(--ac);color:var(--act);border-color:var(--ac);box-shadow:0 5px 12px rgba(36,99,235,.16)}
button.tab[aria-selected=true]{background:var(--hl);color:var(--tx);border-color:var(--ac)}
.card{border:1px solid var(--bd);border-radius:17px;box-shadow:0 7px 24px rgba(19,35,61,.055);padding:18px}
h1{font-size:clamp(25px,4vw,31px);letter-spacing:-.8px;line-height:1.2;margin:5px 0 15px}
h2{letter-spacing:-.3px}
input[type=text],input[type=number],input[type=password],textarea,select{border:1px solid var(--bd);border-radius:11px;background:color-mix(in srgb,var(--card) 84%,var(--bg));}
textarea{line-height:1.65}
.opt{border:1px solid var(--bd);border-radius:11px}
.opt:has(input:checked){border-color:var(--ac);background:var(--hl);color:var(--tx)}
.drop{border:2px dashed #9eb4d3;border-radius:20px;background:var(--card);box-shadow:0 10px 28px rgba(19,35,61,.045);padding:clamp(24px,6vw,42px) 18px}
.drop.over{background:var(--hl);border-color:var(--ac);color:var(--tx)}
.row{border-radius:14px;text-align:left;box-shadow:none!important}
.badge{padding:4px 10px}
.actions{gap:8px;align-items:center}
#passage{min-height:230px}
#question-0{margin-top:4px}
.q{line-height:1.4}
.toast{border:1px solid var(--bd);border-radius:13px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
@media(max-width:560px){main{padding:16px 12px 48px}.bar{padding-left:12px;padding-right:12px}.card{padding:15px;border-radius:15px}.actions>*{max-width:100%}nav button{padding:8px 10px;font-size:15px}.row{align-items:flex-start}.drop{padding:24px 14px}}
</style></head><body>
<header><div class="bar"><span class="logo">✏️ Worksheet Desk · Teacher</span><button id="th" class="sm" aria-label="Toggle light or dark theme">Dark mode</button>
<nav role="tablist" id="nv"></nav></div></header>
<main id="app"></main><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEED={title:'Photosynthesis basics',q:[
{t:'mc',q:'Which gas do plants take in for photosynthesis?',o:['Oxygen','Carbon dioxide','Nitrogen','Hydrogen'],a:1},
{t:'mc',q:'Where in the cell does photosynthesis happen?',o:['Nucleus','Mitochondria','Chloroplast','Ribosome'],a:2},
{t:'tx',q:'In two or three sentences, explain why sunlight matters to a plant.',a:'Sunlight supplies the energy plants use to turn carbon dioxide and water into glucose and oxygen.'},
{t:'tx',q:'Describe what would happen to a plant kept in the dark for a week.',a:'It could not make glucose, so it would run out of stored energy, yellow and eventually die.'}]};
// Remember sign-in between visits. Migrate any existing tab-only session to persistent storage.
const ss={get:k=>{try{let v=localStorage.getItem(k);if(v!==null)return v;v=sessionStorage.getItem(k);if(v!==null){localStorage.setItem(k,v);sessionStorage.removeItem(k)}return v}catch(e){try{return sessionStorage.getItem(k)}catch(_){return null}}},set:(k,v)=>{try{if(v==null){localStorage.removeItem(k);sessionStorage.removeItem(k)}else localStorage.setItem(k,v)}catch(e){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(_){}}}};
const S={wss:[],subs:[],students:[],tmp:null,tab:'upload',up:'idle',D:null,sel:null,maxQuestions:'5',token:ss.get('wdt_t')||'',user:null,auth:false,mode:'login',health:null};
try{S.user=JSON.parse(ss.get('wdt_u')||'null')}catch(e){}
S.auth=!!(S.token&&S.user&&S.user.role==='teacher');if(!S.auth)S.token='';
const pts=q=>q.t==='mc'?1:2,total=w=>w.q.reduce((n,q)=>n+pts(q),0);
/* TEACHER ACCOUNT (checked on the server) */
let LAST=Date.now();
async function api(a,payload){const r=await fetch('/api/server?a='+a,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.token},body:JSON.stringify(payload||{}),cache:'no-store'});
const j=await r.json().catch(()=>({}));if(r.status===401&&S.auth){lock();toast('Your session expired. Please sign in again.')}if(!r.ok)throw Error(j.error||'Request failed');return j}
let refreshing=false;
async function refreshSession(){if(!S.auth||!S.token||refreshing)return;refreshing=true;try{const j=await api('refresh');if(S.auth){S.token=j.token;ss.set('wdt_t',j.token)}}catch(e){/* api() locks an invalid/expired session */}finally{refreshing=false}}
async function pub(a,payload){const r=await fetch('/api/server?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
async function loadState(quiet){try{const j=await api('load');S.wss=j.wss;S.subs=j.subs}catch(e){if(!quiet)toast(e.message)}}
async function saveWss(){try{await api('save',{wss:S.wss});return true}catch(e){toast('Could not save: '+e.message);return false}}
async function loadStudents(){try{S.students=(await api('students')).students}catch(e){toast(e.message)}if(S.auth)render()}
async function resetPw(id){try{const j=await api('resetpw',{id});S.tmp={name:j.name,username:j.username,password:j.password};render();scrollTo(0,0)}catch(e){toast(e.message)}}
async function health(){try{const r=await fetch('/api/server?a=health',{cache:'no-store'});S.health=r.ok?await r.json():false}catch(e){S.health=false}if(!S.auth)render()}
async function authGo(){const m=S.mode,v=id=>($('#'+id)?$('#'+id).value:''),un=v('tu').trim(),pw=v('tp');
if(!un||!pw){toast('Fill in all the boxes');return}
if(m!=='login'&&pw!==v('tp2')){toast('The two passwords do not match');return}
if(m==='create'&&!v('tn').trim()){toast('Enter your name');return}
if(m!=='login'&&!v('tc')){toast('Enter the teacher code');return}
const b=$('#app button.pri');b.disabled=true;
try{if(m==='forgot'){await pub('forgot',{username:un,code:v('tc'),password:pw});S.mode='login';render();toast('Password changed. Sign in with it now.');return}
const j=await pub(m==='create'?'register':'login',m==='create'?{role:'teacher',name:v('tn'),username:un,password:pw,code:v('tc')}:{as:'teacher',username:un,password:pw});
S.token=j.token;S.user=j.user;S.auth=true;ss.set('wdt_t',j.token);ss.set('wdt_u',JSON.stringify(j.user));LAST=Date.now();await loadState();S.tab=S.subs.some(x=>x.status!=='Marked')?'dash':'upload';render();scrollTo(0,0)}
catch(e){toast(e.message==='Failed to fetch'?'Cannot reach the server. Open this page from your website address.':e.message);const bb=$('#app button.pri');if(bb)bb.disabled=false}}
function lock(){S.auth=false;S.token='';S.user=null;ss.set('wdt_t',null);ss.set('wdt_u',null);S.sel=null;S.wss=[];S.subs=[];S.students=[];S.tmp=null;S.tab='upload';S.mode='login';render();scrollTo(0,0)}
addEventListener('keydown',e=>{if(e.key==='Enter'&&['tn','tu','tp','tp2','tc'].includes(e.target.id))authGo()});
// No inactivity logout: the teacher remains signed in until they choose Sign out.
setInterval(()=>{if(S.auth&&!document.hidden)refreshSession()},12*60*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.auth)refreshSession()});
addEventListener('storage',e=>{if(e.key==='wdt_t'&&!e.newValue&&S.auth)lock()});
function gate(){const h=S.health,m=S.mode;let warn='';
if(h===false)warn='<div class="card" style="box-shadow:none;border-color:var(--bad)"><b>Cannot reach the server.</b><p class="mu">Open this page from your website address (for example your-site.vercel.app/teacher), not from a downloaded file.</p></div>';
else if(h&&(!h.db||(m!=='login'&&!h.teacherSignup)))warn='<div class="card" style="box-shadow:none;border-color:var(--bad)"><b>Setup is not finished.</b><ul class="mu">'+(h.db?'':'<li>Check SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in Vercel, and run supabase-setup.sql in Supabase.</li>')+(h.teacherSignup?'':'<li>Add the TEACHER_SIGNUP_CODE environment variable in Vercel.</li>')+'</ul><p class="mu">Then redeploy the project.</p></div>';
const f=(id,l,t,ac,x)=>`<label class="q" for="${id}" style="display:block;margin-top:12px">${l}</label><input type="${t}" id="${id}" autocomplete="${ac}" ${x||''}>`,u=f('tu','Username','text','username','autocapitalize="none" spellcheck="false"');
let title,intro,fields,btn;
if(m==='create'){title='Create teacher account';intro='You need the teacher code from the site owner. Students cannot create teacher accounts without it.';fields=f('tn','Your name','text','name')+u+f('tp','Password (6+ characters)','password','new-password')+f('tp2','Confirm password','password','new-password')+f('tc','Teacher code','password','off');btn='Create account'}
else if(m==='forgot'){title='Reset teacher password';intro='Enter your username and the teacher code, then choose a new password.';fields=u+f('tc','Teacher code','password','off')+f('tp','New password (6+ characters)','password','new-password')+f('tp2','Confirm new password','password','new-password');btn='Reset password'}
else{title='Teacher sign in';intro='Sign in with your teacher account to upload worksheets and mark student work.';fields=u+f('tp','Password','password','current-password');btn='Sign in'}
return warn+`<div class="card"><h1>${title}</h1><p>${intro}</p>${m==='login'?'<p class="mu">You will stay signed in on this device until you choose Sign out. On a shared device, sign out when you finish.</p>':''}${fields}<div class="actions" style="margin-top:14px"><button class="pri" onclick="authGo()">${btn}</button>`+(m==='login'?`<button onclick="S.mode='create';render()">Create teacher account</button><button onclick="S.mode='forgot';render()">Forgot password?</button>`:`<button onclick="S.mode='login';render()">Back</button>`)+'</div></div>'}
function students(){const t=S.tmp,n=S.students.length;
return(t?`<div class="card"><h2>New password for ${esc(t.name)}</h2><p>Username: <b>${esc(t.username)}</b></p><p class="q" style="font-size:26px;letter-spacing:2px" dir="ltr">${esc(t.password)}</p><p class="mu">Tell the student this password. It will not be shown again.</p><button class="pri" onclick="S.tmp=null;render()">Done</button></div>`:'')+
`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>Students</h1><button class="sm" onclick="loadStudents()">Refresh</button></div>`+
(n?`<p class="mu" style="margin-top:-8px">${n} student account${n>1?'s':''}</p>`+S.students.map(x=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:none"><span><b>${esc(x.name)}</b><br><span class="mu">@${esc(x.username)}</span></span><button class="sm" onclick="resetPw(${x.id})" aria-label="Reset password for ${esc(x.name)}">Reset password</button></div>`).join(''):'<div class="card"><p class="mu">No student accounts yet. Students create their own on the student page.</p></div>')}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),4500)}
function go(t){if(t==='stu')loadStudents();S.tab=t;S.sel=null;render();scrollTo(0,0)}
$('#nv').onclick=e=>{const b=e.target.closest('button.tab');if(b)go(b.dataset.t)};
$('#th').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';$('#th').textContent=dark?'Dark mode':'Light mode'};
function render(){
const pend=S.subs.filter(s=>s.status!=='Marked').length,T=S.auth?[['upload','Upload'],['dash','Dashboard'+(pend?' ('+pend+')':'')],['stu','Students']]:[];
$('#nv').innerHTML=T.map(([t,l])=>`<button class="tab" role="tab" data-t="${t}" aria-selected="${S.auth?S.tab===t:(t==='student')===(S.tab==='student')}">${l}</button>`).join('')+(S.auth?'<button class="sm" onclick="lock()" style="flex:none">🔒 Sign out</button>':'');
$('#app').innerHTML=!S.auth?gate():S.tab==='upload'?upload():S.tab==='stu'?students():dash();
document.querySelectorAll('#app .q,#app .cell,#app textarea,#app input[type=text],#app .opt').forEach(e=>e.setAttribute('dir','auto'));
if(S.tab==='upload')bindDrop()}
async function rmWs(id){if(!S.auth)return;const old=S.wss;S.wss=S.wss.filter(x=>x.id!==id);if(!await saveWss()){S.wss=old;return}render();toast('Removed')}
/* UPLOAD */
function upload(){
if(S.up==='busy')return'<div class="card" style="text-align:center;padding:50px 16px" role="status"><div class="spin"></div><h2>Converting worksheet…</h2><p class="mu" id="bm">Separating the reading passage from real questions and answer choices.</p></div>'; 
if(S.up==='review'&&S.D)return review();
return`<h1>Upload a worksheet</h1><p class="mu" style="margin-top:-7px;margin-bottom:16px">Turn a PDF into a student-ready worksheet. Gemini separates the 文章 / petikan from real question prompts and keeps the default set short. If AI is unavailable, a local PDF reader is used instead.</p><div class="drop" id="dz"><div style="font-size:40px">📄</div><p class="q">Drag a PDF here or tap to browse</p><p class="mu">Best results come from clear, text-based PDFs. Scanned pages use text recognition. You can correct every field before publishing.</p><label class="q" for="lg" style="display:block;margin:16px 0 5px">Worksheet language / OCR language</label><select id="lg" aria-label="Worksheet language" onchange="S.lang=this.value">${LG.map(l=>`<option value="${l[0]}" ${S.lang===l[0]?'selected':''}>${l[1]}</option>`).join('')}</select><label class="q" for="mq" style="display:block;margin:14px 0 5px">Maximum questions to import</label><select id="mq" aria-label="Maximum questions to import" onchange="S.maxQuestions=this.value"><option value="3" ${S.maxQuestions==='3'?'selected':''}>3 questions</option><option value="5" ${S.maxQuestions==='5'?'selected':''}>5 questions · recommended</option><option value="8" ${S.maxQuestions==='8'?'selected':''}>8 questions</option><option value="10" ${S.maxQuestions==='10'?'selected':''}>10 questions</option><option value="all" ${S.maxQuestions==='all'?'selected':''}>All detected questions · local reader</option></select><div class="actions" style="margin-top:16px;justify-content:center"><button class="pri" id="bb">Choose PDF</button><button id="sb">Try a sample</button></div><input type="file" id="fi" accept=".pdf,application/pdf" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" tabindex="-1" aria-hidden="true"></div>`+(S.wss.length?`<h2 style="margin-top:20px">Published worksheets (${S.wss.length})</h2>`+S.wss.map(w=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:none"><span><b>${esc(w.title)}</b><br><span class="mu">${w.q.length} questions</span></span><button class="sm" onclick="rmWs(${w.id})" aria-label="Remove ${esc(w.title)}">Remove</button></div>`).join(''):'<p class="mu">No worksheets published yet.</p>')}

const MS_CONTEXT=[

const MS_STOP=new Set('yang dan atau dengan untuk kepada dalam daripada pada ialah adalah itu ini dia mereka saya kami kita anda tidak telah akan sudah oleh di ke se satu sebuah seorang seekor kata maksud perkataan berikut antara pilih jawapan paling sesuai betul salah ayat petikan berdasarkan menurut'.split(' '));
function msTokens(x){return msNorm(x).split(/\s+/).filter(w=>w.length>2&&!MS_STOP.has(w))}
function offlineMalay(q,passage){
 if(!q||q.t!=='mc'||!Array.isArray(q.o)||q.o.length<2)return null;
 const opts=q.o.map(msNorm),prompt=msNorm(q.q),body=msNorm(passage||'');
 const optionsUnique=new Set(opts.filter(Boolean));
 if(optionsUnique.size!==opts.length)return null;
 const evidence=[];
 const offer=(i,points,why)=>{if(i>=0&&opts[i])evidence.push({i,points,why})};
 // Match a Malay counting word to the noun immediately AFTER the blank. Avoid
 // answering an unrelated noun mentioned elsewhere in the question.
 const gap=String(q.q).match(/\bse\s*[_….-]+\s*([\p{L}]+(?:\s+[\p{L}]+)?)/iu)||
            String(q.q).match(/\bse\s+([\p{L}]+(?:\s+[\p{L}]+)?)/iu);
 if(gap){
  const following=msNorm(gap[1]);
  const noun=following.split(' ')[0];
  if(noun){
   for(let i=0;i<opts.length;i++){
    const candidate=opts[i];
    const nouns=[...(MS_CLASSIFIERS[candidate]||[]),...(MS_MORE_CLASSIFIERS[candidate]||[])];
    if(nouns.some(n=>noun===n||following.startsWith(n+' ')))offer(i,105,'Penjodoh bilangan “'+candidate+'” untuk “'+noun+'”.');
   }
  }
 }
 // Explicit synonym/antonym vocabulary tasks. Only answer when target is unambiguous.
 const opposite=/\b(lawan kata|antonim|berlawanan maksud|berlawanan erti)\b/u.test(prompt);
 const synonym=/\b(sinonim|sama maksud|sama erti|seerti)\b/u.test(prompt);
 if(opposite||synonym){
  const lexicon=opposite?MS_OPPOSITES:MS_SYNONYMS;
  for(const [term,words] of Object.entries(lexicon)){
   const re=new RegExp('\\b'+term.replace(/ /g,'\\s+')+'\\b','iu');
   if(!re.test(prompt))continue;
   for(let i=0;i<opts.length;i++)if(words.some(w=>opts[i]===msNorm(w)))offer(i,90,(opposite?'Antonim':'Sinonim')+' bagi “'+term+'”.');
  }
 }
 // Context-clue completion for common school-level Malay vocabulary.
 if(!opposite&&!synonym){
  for(const [re,word] of MS_CONTEXT){if(!re.test(prompt))continue;
   const allowed=(MS_WORDS[word]||[word]).map(msNorm);
   for(let i=0;i<opts.length;i++)if(allowed.includes(opts[i]))offer(i,80,'Petunjuk konteks bahasa Melayu: “'+word+'”.');
  }
 }
 // Comprehension: sentence-level overlap + exact candidate mention, NOT just
 // choosing an option because it appears anywhere in a long passage.
 if(body&&/berdasarkan|menurut|petikan|siapakah|apakah|mengapakah|bilakah|di manakah|bagaimanakah/u.test(prompt)){
  const tokens=msTokens(prompt).filter(w=>w.length>3);
  const sentences=String(passage).split(/[.!?。！？\n]+/).map(msNorm).filter(Boolean);
  for(const sentence of sentences){
   const overlap=tokens.filter(w=>sentence.includes(w)).length;
   if(overlap<2)continue;
   for(let i=0;i<opts.length;i++){
    const val=opts[i];
    if(val.length<3||!sentence.includes(val))continue;
    // Score only the strongest passage sentence; avoid repeated mentions adding false certainty.
    offer(i,Math.min(55,24+overlap*6),'Perkataan jawapan ditemui bersama petunjuk soalan dalam petikan.');
   }
  }
 }
 // Prefer evidence that strongly discriminates ONE answer. Never fill ambiguous answers.
 const scores=opts.map(()=>0),reasons=opts.map(()=>[]);
 for(const ev of evidence){scores[ev.i]=Math.max(scores[ev.i],ev.points);reasons[ev.i].push(ev.why)}
 const order=scores.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);
 if(!order.length||order[0].v<42||order[0].v-order[1].v<20)return null;
 return {a:order[0].i,why:[...new Set(reasons[order[0].i])][0]+' Semak sebelum terbit.',confidence:order[0].v>=80?'high':'medium'};
}

async function geminiSuggest(index=null){
 if(!S.auth || !S.D)return;
 const indexes=S.D.q.map((q,i)=>i).filter(i=>index===null?(S.D.q[i].t==='mc'&&!Number.isInteger(S.D.q[i].a) || S.D.q[i].t==='tx'&&!String(S.D.q[i].a||'').trim()):i===index);
 if(!indexes.length){toast('No unanswered questions. You can still use Gemini on one question.');return}
 let changed=0,uncertain=0;
 toast('🤖 Gemini is reading your worksheet…');
 for(let start=0;start<indexes.length;start+=30){
  const slice=indexes.slice(start,start+30);
  try{
   const result=await api('geminiAnswers',{passage:S.D.passage||'',questions:slice.map(i=>{const q=S.D.q[i];return {t:q.t,q:q.q,...(q.t==='mc'?{o:q.o}:{})}})});
   for(const a of result.answers||[]){
    const i=slice[a.index],q=S.D.q[i];if(!q)continue;
    if(a.confidence==='low'){uncertain++;continue}
    if(q.t==='mc'&&Number.isInteger(a.answerIndex)){
      q.a=a.answerIndex;q.suggestion='Gemini ('+a.confidence+'): '+a.reason;changed++;
    }else if(q.t==='tx'&&typeof a.modelAnswer==='string'&&a.modelAnswer.trim()){
      q.a=a.modelAnswer;q.suggestion='Gemini ('+a.confidence+'): '+a.reason;changed++;
    }else uncertain++;
   }
  }catch(e){toast('Gemini: '+e.message+' — offline suggestions are still available.');render();return}
 }
 render();toast('Gemini suggested '+changed+' answer(s). '+(uncertain?uncertain+' uncertain. ':'')+'Please review before publishing.');
}
// One tap checks EVERY question with Gemini. Never silently changes teacher-selected answers.
let checkingAll=false;
async function checkAllWithGemini(){
 if(checkingAll||!S.auth||!S.D)return;
 checkingAll=true;
 let filled=0,review=0,uncertain=0;
 const qs=S.D.q, indexes=qs.map((_,i)=>i);
 const btn=document.getElementById('check-all-ai');if(btn){btn.disabled=true;btn.textContent='🤖 Checking all questions…'}
 try{
  for(let start=0;start<indexes.length;start+=25){
   const slice=indexes.slice(start,start+25);
   const result=await api('geminiAnswers',{passage:S.D.passage||'',questions:slice.map(i=>{const q=qs[i];return {t:q.t,q:q.q,...(q.t==='mc'?{o:q.o}:{})}})});
   for(const a of result.answers||[]){
    if(!Number.isInteger(a.index)||a.index<0||a.index>=slice.length)continue;
    const i=slice[a.index],q=qs[i];if(!q)continue;
    if(a.confidence==='low'){uncertain++;q.suggestion='Gemini is uncertain. Review manually.';continue}
    const reason=String(a.reason||'').slice(0,220);
    if(q.t==='mc'&&Number.isInteger(a.answerIndex)&&a.answerIndex>=0&&a.answerIndex<q.o.length){
     if(Number.isInteger(q.a)&&q.a>=0&&q.a<q.o.length){
      if(q.a!==a.answerIndex){review++;q.suggestion='⚠️ Teacher answer differs from Gemini suggestion: '+q.o[a.answerIndex]+'. '+reason}
      else q.suggestion='Gemini agrees with the selected answer. '+reason;
     }else{q.a=a.answerIndex;filled++;q.suggestion='Gemini ('+a.confidence+'): '+reason}
    }else if(q.t==='tx'&&typeof a.modelAnswer==='string'&&a.modelAnswer.trim()){
     if(String(q.a||'').trim()){q.suggestion='Gemini suggested model answer (compare with yours): '+a.modelAnswer.slice(0,350);review++}
     else{q.a=a.modelAnswer;filled++;q.suggestion='Gemini ('+a.confidence+'): '+reason}
    }else uncertain++;
   }
  }
  render();toast('AI checked '+indexes.length+' questions: '+filled+' filled, '+review+' to review, '+uncertain+' uncertain. Verify before publishing.');
 }catch(e){render();toast('AI check stopped: '+e.message+'; answers checked so far are kept.');}
 finally{checkingAll=false;const b=document.getElementById('check-all-ai');if(b){b.disabled=false;b.textContent='🤖 AI: Check ALL questions'}}
}

async function saveGrade(id){if(!S.auth)return;const s=S.subs.find(x=>x.id===id),mx=total(s.ws),v=Number($('#sc').value);
if(isNaN(v)||v<0||v>mx){toast('Enter a score from 0 to '+mx);return}
try{const j=await api('grade',{id,score:v,fb:$('#fb').value});Object.assign(s,j.sub);S.sel=null;render();toast('Grade saved')}catch(e){toast('Could not save: '+e.message)}}
async function refresh(){await loadState();render();toast('Updated')}
setInterval(async()=>{if(S.auth&&S.tab==='dash'&&!S.sel&&!document.hidden){await loadState(true);if(S.auth&&S.tab==='dash'&&!S.sel)render()}},15000);
health();
if(S.auth)refreshSession().then(()=>{if(!S.auth)return;return loadState().then(()=>{if(S.auth){S.tab=S.subs.some(x=>x.status!=='Marked')?'dash':'upload';render()}})});
render();
</script></body></html>
