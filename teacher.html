<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Worksheet Desk · Teacher</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--tx:#14213d;--mu:#5b6578;--bd:#cfd7e3;--ac:#14213d;--act:#fff;--hl:#ffd23f;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;--wn:#92400e;--wnb:#fef3c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1824;--card:#16253a;--tx:#e8eef5;--mu:#9fb0c6;--bd:#2b3d57;--ac:#ffd23f;--act:#14213d;--ok:#86efac;--okb:#14391f;--bad:#fca5a5;--badb:#4a1d1d;--wn:#fcd34d;--wnb:#4a3411}}
:root[data-theme="dark"]{--bg:#0d1824;--card:#16253a;--tx:#e8eef5;--mu:#9fb0c6;--bd:#2b3d57;--ac:#ffd23f;--act:#14213d;--ok:#86efac;--okb:#14391f;--bad:#fca5a5;--badb:#4a1d1d;--wn:#fcd34d;--wnb:#4a3411}
select{width:100%;max-width:300px;background:var(--bg);border:2px solid var(--bd);border-radius:8px;padding:10px;min-height:44px;font:inherit;color:inherit}
*,*:before,*:after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif;background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
header{background:var(--card);border-bottom:2px solid var(--tx);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:860px;margin:auto;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;margin-right:auto}
nav{display:flex;gap:6px;overflow-x:auto;width:100%;order:3}
nav button{flex:1;white-space:nowrap}
main{max-width:860px;margin:auto;padding:16px 14px 60px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--tx);background:var(--card);border-radius:8px;padding:9px 14px;min-height:44px}
button.tab[aria-selected=true]{background:var(--hl);color:#14213d;font-weight:700}
button.pri{background:var(--ac);color:var(--act);font-weight:700}
button.sm{min-height:36px;padding:4px 10px;font-size:15px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--tx);border-radius:10px;padding:16px;margin:0 0 14px;box-shadow:4px 4px 0 var(--tx)}
h1{font-size:26px;margin:4px 0 14px}h2{font-size:20px;margin:0 0 8px}
.mu{color:var(--mu);font-size:15px}
input[type=text],input[type=number],input[type=password],textarea{width:100%;background:var(--bg);border:2px solid var(--bd);border-radius:8px;padding:10px;min-height:44px}
textarea{min-height:100px;resize:vertical}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:2px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
.opt input[type=radio]{width:22px;height:22px;accent-color:var(--tx);flex:none}
.opt:has(input:checked){border-color:var(--tx);background:var(--hl);color:#14213d}
.needs-answer{border-color:#c2410c!important;box-shadow:4px 4px 0 #c2410c!important}
.answer-warning{color:#9a3412;background:#ffedd5;padding:10px;border-radius:8px;font-weight:700;margin:8px 0}
.opt.edit{cursor:default}.opt.edit input[type=text]{border:0;padding:4px;min-height:32px;background:transparent}
.q{font-weight:700;margin:0 0 10px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:14px;font-weight:700}
.b-p{background:var(--wnb);color:var(--wn)}.b-m{background:var(--okb);color:var(--ok)}
.drop{border:3px dashed var(--tx);border-radius:12px;padding:36px 16px;text-align:center;background:var(--card)}
.drop.over{background:var(--hl);color:#14213d}
.spin{width:44px;height:44px;border:5px solid var(--bd);border-top-color:var(--tx);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation-duration:4s}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;margin:0 0 10px;padding:14px;box-shadow:3px 3px 0 var(--tx)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.cmp{grid-template-columns:1fr}}
.cell{border-radius:8px;padding:10px;border:2px solid var(--bd);white-space:pre-wrap;overflow-wrap:anywhere}
.cell.good{background:var(--okb);border-color:var(--ok)}.cell.bad{background:var(--badb);border-color:var(--bad)}
.cell b{display:block;font-size:14px;color:var(--mu)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(10,18,30,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .card{max-width:380px;text-align:center;margin:0}
.tick{font-size:48px}
.toast{max-width:90vw;text-align:center;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:30}
</style></head><body>
<header><div class="bar"><span class="logo">✏️ Worksheet Desk · Teacher</span><button id="th" class="sm" aria-label="Toggle light or dark theme">Dark mode</button>
<nav role="tablist" id="nv"></nav></div></header>
<main id="app"></main><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEED={title:'Photosynthesis basics',q:[
{t:'mc',q:'Which gas do plants take in for photosynthesis?',o:['Oxygen','Carbon dioxide','Nitrogen','Hydrogen'],a:1},
{t:'mc',q:'Where in the cell does photosynthesis happen?',o:['Nucleus','Mitochondria','Chloroplast','Ribosome'],a:2},
{t:'tx',q:'In two or three sentences, explain why sunlight matters to a plant.',a:'Sunlight supplies the energy plants use to turn carbon dioxide and water into glucose and oxygen.'},
{t:'tx',q:'Describe what would happen to a plant kept in the dark for a week.',a:'It could not make glucose, so it would run out of stored energy, yellow and eventually die.'}]};
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}};
const S={wss:[],subs:[],students:[],tmp:null,tab:'upload',up:'idle',D:null,sel:null,token:ss.get('wdt_t')||'',user:null,auth:false,mode:'login',health:null};
try{S.user=JSON.parse(ss.get('wdt_u')||'null')}catch(e){}
S.auth=!!(S.token&&S.user&&S.user.role==='teacher');if(!S.auth)S.token='';
const pts=q=>q.t==='mc'?1:2,total=w=>w.q.reduce((n,q)=>n+pts(q),0);
/* TEACHER ACCOUNT (checked on the server) */
let LAST=Date.now();
async function api(a,payload){const r=await fetch('/api/server?a='+a,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.token},body:JSON.stringify(payload||{}),cache:'no-store'});
const j=await r.json().catch(()=>({}));if(r.status===401&&S.auth){lock();toast('Please sign in again.')}if(!r.ok)throw Error(j.error||'Request failed');return j}
async function pub(a,payload){const r=await fetch('/api/server?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
async function loadState(quiet){try{const j=await api('load');S.wss=j.wss;S.subs=j.subs}catch(e){if(!quiet)toast(e.message)}}
async function saveWss(){try{await api('save',{wss:S.wss});return true}catch(e){toast('Could not save: '+e.message);return false}}
async function loadStudents(){try{S.students=(await api('students')).students}catch(e){toast(e.message)}if(S.auth)render()}
async function resetPw(id){try{const j=await api('resetpw',{id});S.tmp={name:j.name,username:j.username,password:j.password};render();scrollTo(0,0)}catch(e){toast(e.message)}}
async function health(){try{const r=await fetch('/api/server?a=health',{cache:'no-store'});S.health=r.ok?await r.json():false}catch(e){S.health=false}if(!S.auth)render()}
async function authGo(){const m=S.mode,v=id=>($('#'+id)?$('#'+id).value:''),un=v('tu').trim(),pw=v('tp');
if(!un||!pw){toast('Fill in all the boxes');return}
if(m!=='login'&&pw!==v('tp2')){toast('The two passwords do not match');return}
if(m==='create'&&!v('tn').trim()){toast('Enter your name');return}
if(m!=='login'&&!v('tc')){toast('Enter the teacher code');return}
const b=$('#app button.pri');b.disabled=true;
try{if(m==='forgot'){await pub('forgot',{username:un,code:v('tc'),password:pw});S.mode='login';render();toast('Password changed. Sign in with it now.');return}
const j=await pub(m==='create'?'register':'login',m==='create'?{role:'teacher',name:v('tn'),username:un,password:pw,code:v('tc')}:{as:'teacher',username:un,password:pw});
S.token=j.token;S.user=j.user;S.auth=true;ss.set('wdt_t',j.token);ss.set('wdt_u',JSON.stringify(j.user));LAST=Date.now();await loadState();S.tab=S.subs.some(x=>x.status!=='Marked')?'dash':'upload';render();scrollTo(0,0)}
catch(e){toast(e.message==='Failed to fetch'?'Cannot reach the server. Open this page from your website address.':e.message);const bb=$('#app button.pri');if(bb)bb.disabled=false}}
function lock(){S.auth=false;S.token='';S.user=null;ss.set('wdt_t',null);ss.set('wdt_u',null);S.sel=null;S.wss=[];S.subs=[];S.students=[];S.tmp=null;S.tab='upload';S.mode='login';render();scrollTo(0,0)}
['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>{LAST=Date.now()}));
addEventListener('keydown',e=>{if(e.key==='Enter'&&['tn','tu','tp','tp2','tc'].includes(e.target.id))authGo()});
setInterval(()=>{if(S.auth&&Date.now()-LAST>6e5){lock();toast('Signed out after 10 minutes of inactivity')}},15000);
function gate(){const h=S.health,m=S.mode;let warn='';
if(h===false)warn='<div class="card" style="box-shadow:none;border-color:var(--bad)"><b>Cannot reach the server.</b><p class="mu">Open this page from your website address (for example your-site.vercel.app/teacher), not from a downloaded file.</p></div>';
else if(h&&(!h.db||(m!=='login'&&!h.teacherSignup)))warn='<div class="card" style="box-shadow:none;border-color:var(--bad)"><b>Setup is not finished.</b><ul class="mu">'+(h.db?'':'<li>Check SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in Vercel, and run supabase-setup.sql in Supabase.</li>')+(h.teacherSignup?'':'<li>Add the TEACHER_SIGNUP_CODE environment variable in Vercel.</li>')+'</ul><p class="mu">Then redeploy the project.</p></div>';
const f=(id,l,t,ac,x)=>`<label class="q" for="${id}" style="display:block;margin-top:12px">${l}</label><input type="${t}" id="${id}" autocomplete="${ac}" ${x||''}>`,u=f('tu','Username','text','username','autocapitalize="none" spellcheck="false"');
let title,intro,fields,btn;
if(m==='create'){title='Create teacher account';intro='You need the teacher code from the site owner. Students cannot create teacher accounts without it.';fields=f('tn','Your name','text','name')+u+f('tp','Password (6+ characters)','password','new-password')+f('tp2','Confirm password','password','new-password')+f('tc','Teacher code','password','off');btn='Create account'}
else if(m==='forgot'){title='Reset teacher password';intro='Enter your username and the teacher code, then choose a new password.';fields=u+f('tc','Teacher code','password','off')+f('tp','New password (6+ characters)','password','new-password')+f('tp2','Confirm new password','password','new-password');btn='Reset password'}
else{title='Teacher sign in';intro='Sign in with your teacher account to upload worksheets and mark student work.';fields=u+f('tp','Password','password','current-password');btn='Sign in'}
return warn+`<div class="card"><h1>${title}</h1><p>${intro}</p>${fields}<div class="actions" style="margin-top:14px"><button class="pri" onclick="authGo()">${btn}</button>`+(m==='login'?`<button onclick="S.mode='create';render()">Create teacher account</button><button onclick="S.mode='forgot';render()">Forgot password?</button>`:`<button onclick="S.mode='login';render()">Back</button>`)+'</div></div>'}
function students(){const t=S.tmp,n=S.students.length;
return(t?`<div class="card"><h2>New password for ${esc(t.name)}</h2><p>Username: <b>${esc(t.username)}</b></p><p class="q" style="font-size:26px;letter-spacing:2px" dir="ltr">${esc(t.password)}</p><p class="mu">Tell the student this password. It will not be shown again.</p><button class="pri" onclick="S.tmp=null;render()">Done</button></div>`:'')+
`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>Students</h1><button class="sm" onclick="loadStudents()">Refresh</button></div>`+
(n?`<p class="mu" style="margin-top:-8px">${n} student account${n>1?'s':''}</p>`+S.students.map(x=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:none"><span><b>${esc(x.name)}</b><br><span class="mu">@${esc(x.username)}</span></span><button class="sm" onclick="resetPw(${x.id})" aria-label="Reset password for ${esc(x.name)}">Reset password</button></div>`).join(''):'<div class="card"><p class="mu">No student accounts yet. Students create their own on the student page.</p></div>')}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),4500)}
function go(t){if(t==='stu')loadStudents();S.tab=t;S.sel=null;render();scrollTo(0,0)}
$('#nv').onclick=e=>{const b=e.target.closest('button.tab');if(b)go(b.dataset.t)};
$('#th').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';$('#th').textContent=dark?'Dark mode':'Light mode'};
function render(){
const pend=S.subs.filter(s=>s.status!=='Marked').length,T=S.auth?[['upload','Upload'],['dash','Dashboard'+(pend?' ('+pend+')':'')],['stu','Students']]:[];
$('#nv').innerHTML=T.map(([t,l])=>`<button class="tab" role="tab" data-t="${t}" aria-selected="${S.auth?S.tab===t:(t==='student')===(S.tab==='student')}">${l}</button>`).join('')+(S.auth?'<button class="sm" onclick="lock()" style="flex:none">🔒 Sign out</button>':'');
$('#app').innerHTML=!S.auth?gate():S.tab==='upload'?upload():S.tab==='stu'?students():dash();
document.querySelectorAll('#app .q,#app .cell,#app textarea,#app input[type=text],#app .opt').forEach(e=>e.setAttribute('dir','auto'));
if(S.tab==='upload')bindDrop()}
async function rmWs(id){if(!S.auth)return;const old=S.wss;S.wss=S.wss.filter(x=>x.id!==id);if(!await saveWss()){S.wss=old;return}render();toast('Removed')}
/* UPLOAD */
function upload(){
if(S.up==='busy')return'<div class="card" style="text-align:center;padding:50px 16px" role="status"><div class="spin"></div><h2>AI converting worksheet to digital format…</h2><p class="mu" id="bm">Reading questions and finding answer choices.</p></div>';
if(S.up==='review'&&S.D)return review();
return`<h1>Upload a worksheet</h1><div class="drop" id="dz"><div style="font-size:40px">📄</div><p class="q">Drag a PDF here or tap to browse</p><p class="mu">Extract questions and reading comprehension passages (文章 / petikan) from PDFs in English or Bahasa Melayu. Review all extracted text before publishing.</p><p class="mu" style="margin:12px 0 4px">Worksheet language (used for scanned PDFs)</p><select id="lg" aria-label="Worksheet language" onchange="S.lang=this.value">${LG.map(l=>`<option value="${l[0]}" ${S.lang===l[0]?'selected':''}>${l[1]}</option>`).join('')}</select><div class="actions" style="margin-top:14px" style="justify-content:center"><button class="pri" id="bb">Choose PDF</button><button id="sb">Try a sample</button></div><input type="file" id="fi" accept=".pdf,application/pdf" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" tabindex="-1" aria-hidden="true"></div>`+(S.wss.length?`<h2 style="margin-top:20px">Published worksheets (${S.wss.length})</h2>`+S.wss.map(w=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:none"><span><b>${esc(w.title)}</b><br><span class="mu">${w.q.length} questions</span></span><button class="sm" onclick="rmWs(${w.id})" aria-label="Remove ${esc(w.title)}">Remove</button></div>`).join(''):'<p class="mu">No worksheets published yet.</p>')}
function bindDrop(){const dz=$('#dz'),fi=$('#fi');if(!dz)return;
dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');pick(e.dataTransfer.files[0])};
$('#bb').onclick=()=>fi.click();$('#sb').onclick=()=>pick({name:'Photosynthesis basics.pdf',type:'application/pdf'});
fi.onchange=()=>{if(fi.files&&fi.files[0])pick(fi.files[0]);else toast('No file was selected')}}
function pick(f){if(!S.auth||!f)return;if(!/pdf$/i.test(f.type)&&!/\.pdf$/i.test(f.name)){toast('Please choose a PDF file');return}
S.up='busy';render();
const nm=f.name.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ').trim()||'Untitled worksheet';
(f.arrayBuffer?readLines(f).then(L=>L.join('').length>15?L:ocrLines(f)).then(L=>{const D=parse(L,nm.charAt(0).toUpperCase()+nm.slice(1));
if(!D.q.length)throw Error(L.length?"Couldn't find questions in this PDF. Number them like 1. or Q1.":'No readable text found, even with text recognition. Try a clearer scan, or pick the worksheet language.');return D}):Promise.resolve(JSON.parse(JSON.stringify(SEED))))
.then(D=>{S.D=D;S.up='review';render()}).catch(e=>{S.up='idle';render();toast(e.message||'Could not read this PDF')})}
const PB='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
const pdfOpts=async f=>({data:await f.arrayBuffer(),cMapUrl:PB+'cmaps/',cMapPacked:true,standardFontDataUrl:PB+'standard_fonts/'});
function loadPdfJs(){return(window.pdfjsLib?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src=PB+'build/pdf.min.js';s.onload=ok;s.onerror=()=>no(Error('Could not load the PDF reader. Check your internet connection.'));document.head.append(s)})).then(()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PB+'build/pdf.worker.min.js'})}
const DG=d=>{let c=d.codePointAt(0),b=c;while(/\p{Nd}/u.test(String.fromCodePoint(b-1)))b--;return(c-b)%10};
const norm=l=>l.replace(/[\u2460-\u2467]/g,c=>' '+'ABCDEFGH'[c.charCodeAt(0)-9312]+') ').normalize('NFKC').replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,'').replace(/\p{Nd}/gu,DG).replace(/\s+/g,' ').trim();
const LG=[['eng','English'],['msa','Bahasa Melayu'],['chi_sim','简体中文 (Chinese Simplified)'],['chi_tra','繁體中文 (Chinese Traditional)'],['jpn','日本語 (Japanese)'],['kor','한국어 (Korean)'],['ara','العربية (Arabic)'],['heb','עברית (Hebrew)'],['rus','Русский (Russian)'],['ell','Ελληνικά (Greek)'],['hin','हिन्दी (Hindi)'],['spa','Español'],['fra','Français'],['deu','Deutsch'],['por','Português'],['ita','Italiano'],['tur','Türkçe']];
{const d=(navigator.language||'en').toLowerCase();S.lang=/zh-(tw|hk|hant)/.test(d)?'chi_tra':d.startsWith('zh')?'chi_sim':({ms:'msa',ja:'jpn',ko:'kor',ar:'ara',he:'heb',ru:'rus',el:'ell',hi:'hin',es:'spa',fr:'fra',de:'deu',pt:'por',it:'ita',tr:'tur'}[d.slice(0,2)]||'eng')}
const say=t=>{const e=$('#bm');if(e)e.textContent=t};
const CJK='(\\p{Script=Han}|[\\u3040-\\u30ff\\uac00-\\ud7af])',CJR=new RegExp(CJK+'\\s+(?='+CJK.slice(1,-1).replace(/^/,'')+')','gu');
function loadScript(u,flag){return window[flag]?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(Error('Could not load the text recognition engine. Check your internet connection.'));document.head.append(s)})}
async function ocrLines(f){say('Loading the text recognition engine…');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js','Tesseract');
const doc=await pdfjsLib.getDocument(await pdfOpts(f)).promise,lg=S.lang==='eng'?'eng':S.lang+'+eng',out=[];let pg=0;
const w=await Tesseract.createWorker(lg,1,{logger:m=>say(m.status==='recognizing text'?'Reading page '+pg+' of '+Math.min(doc.numPages,15)+'… '+Math.round(m.progress*100)+'%':'Preparing text recognition. The first run downloads language data.')});
try{for(pg=1;pg<=doc.numPages&&pg<=15;pg++){const page=await doc.getPage(pg),vp=page.getViewport({scale:2.5}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
const r=await w.recognize(c);r.data.text.split('\n').forEach(l=>{const n=norm(l.replace(CJR,'$1'));if(n)out.push(n)})}}finally{await w.terminate()}
return out}
async function readLines(f){await loadPdfJs();const doc=await pdfjsLib.getDocument(await pdfOpts(f)).promise,pages=[];
for(let p=1;p<=doc.numPages;p++){const tc=await(await doc.getPage(p)).getTextContent(),rows={},out=[];
tc.items.forEach(it=>{if(!it.str)return;const y=Math.round(it.transform[5]/4);(rows[y]=rows[y]||[]).push(it)});

`<div class="actions" style="margin-bottom:12px"><button class="pri" id="check-all-ai" onclick="checkAllWithGemini()">🤖 AI: Check ALL questions</button><button onclick="geminiSuggest()">🤖 Gemini: suggest missing answers</button><button onclick="suggestAll()">🇲🇾 Offline: Check missing Malay answers</button><span class="mu">Suggestions require teacher review; uncertain questions are left blank.</span></div>`+
D.q.map((q,i)=>`<div class="card" id="question-${i}"><div style="display:flex;justify-content:space-between;align-items:center"><span class="badge b-p">${q.t==='mc'?'Multiple choice':'Written sentences'}</span><button class="sm" onclick="S.D.q.splice(${i},1);render()" aria-label="Delete question ${i+1}">Delete</button></div>
<textarea style="min-height:70px;margin:10px 0" aria-label="Question ${i+1} text" oninput="S.D.q[${i}].q=this.value">${esc(q.q)}</textarea>`+
(q.t==='mc'?q.o.map((o,j)=>`<div class="opt edit"><input type="radio" name="c${i}" ${q.a===j?'checked':''} onchange="S.D.q[${i}].a=${j}" aria-label="Mark option ${j+1} correct"><input type="text" value="${esc(o)}" oninput="S.D.q[${i}].o[${j}]=this.value" aria-label="Option ${j+1}"></div>`).join('')+`<button class="sm" onclick="S.D.q[${i}].o.push('New option');render()">+ Add option</button><button class="sm" style="margin-left:8px" onclick="S.D.q[${i}]={t:'tx',q:S.D.q[${i}].q,a:''};render()">Change to written question</button><button class="sm" style="margin-left:8px" onclick="geminiSuggest(${i})">🤖 Gemini answer</button><button class="sm" onclick="suggestOne(${i})">🇲🇾 Offline</button>${q.suggestion?`<p class="mu" role="status">⚠️ Suggested: ${esc(q.suggestion)} Please verify.</p>`:''}<p class="mu">Select the radio button next to the correct answer. If students should type an answer instead, choose Change to written question.</p>`:
`<label class="mu" for="a${i}">Model answer (shown to you when marking)</label><textarea id="a${i}" oninput="S.D.q[${i}].a=this.value">${esc(q.a)}</textarea><button class="sm" onclick="geminiSuggest(${i})">🤖 Suggest written answer with Gemini</button>${q.suggestion?`<p class="mu">⚠️ ${esc(q.suggestion)} — verify before publishing.</p>`:''}`)+'</div>').join('')+
`<div class="actions" style="margin-bottom:14px"><button onclick="S.D.q.push({t:'mc',q:'New question',o:['Option A','Option B','Option C'],a:0});render()">+ Multiple choice</button><button onclick="S.D.q.push({t:'tx',q:'New written question',a:''});render()">+ Written question</button></div>
<div class="actions"><button class="pri" onclick="publish()">Publish worksheet</button><button onclick="S.up='idle';S.D=null;render()">Discard</button></div>`}
async function publish(){if(!S.auth)return;if(!S.D.q.length){toast('Add at least one question');return}
const missing=S.D.q.findIndex(q=>q.t==='mc'&&(!Number.isInteger(q.a)||q.a<0||q.a>=q.o.length));
if(missing!==-1){
  const card=document.getElementById('question-'+missing);
  if(card){card.classList.add('needs-answer');
    const warning=document.createElement('p');warning.className='answer-warning';warning.setAttribute('role','alert');
    warning.textContent='Question '+(missing+1)+' needs a correct multiple-choice answer. Select the circle beside the right option, or tap “Change to written question” if students should type their answer.';
    card.insertBefore(warning,card.children[1]);card.scrollIntoView({behavior:'smooth',block:'center'});
  }
  toast('Please check question '+(missing+1)+' above');return;
}
const w={id:Date.now(),title:S.D.title,lang:S.D.lang||'en',passage:S.D.passage||'',q:S.D.q};S.wss.push(w);if(!await saveWss()){S.wss.pop();return}S.D=null;S.up='idle';toast('Published');render();scrollTo(0,0)}
/* DASHBOARD */
const fmt=t=>new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
function dash(){if(S.sel)return grade(S.subs.find(s=>s.id===S.sel));
if(!S.subs.length)return'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>Submissions</h1><button class="sm" onclick="refresh()">Refresh</button></div><div class="card"><h2>No submissions yet</h2><p class="mu">When a student submits from the student page, their work shows up here.</p></div>';
return'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>Submissions</h1><button class="sm" onclick="refresh()">Refresh</button></div>'+S.subs.map(s=>`<button class="row card" onclick="S.sel=${s.id};render()"><span><b>${esc(s.name)}</b>${s.username?' <span class="mu">@'+esc(s.username)+'</span>':''}<br><span class="mu">${esc(s.ws.title)} · ${fmt(s.ts)}</span></span><span class="badge ${s.status==='Marked'?'b-m':'b-p'}">${s.status}${s.status==='Marked'?' · '+s.score+'/'+total(s.ws):''}</span></button>`).join('')}
function grade(s){if(!s){S.sel=null;return dash()}
let auto=0;const body=s.ws.q.map((q,i)=>{const a=s.ans[i];let st,cr;
if(q.t==='mc'){const ok=a===q.a;if(ok)auto++;st=`<div class="cell ${a==null?'bad':ok?'good':'bad'}"><b>Student chose</b>${a==null?'(no answer)':esc(q.o[a])}</div>`;cr=`<div class="cell"><b>Correct answer</b>${esc(q.o[q.a])}</div>`}
else{st=`<div class="cell"><b>Student wrote</b>${a&&a.trim()?esc(a):'(no answer)'}</div>`;cr=`<div class="cell"><b>Model answer</b>${esc(q.a)||'(none set)'}</div>`}
return`<div class="card"><p class="q">${i+1}. ${esc(q.q)} <span class="mu">(${pts(q)} pt${pts(q)>1?'s':''})</span></p><div class="cmp">${st}${cr}</div></div>`}).join('');
const sc=s.score==null?auto:s.score;
return`<button class="sm" onclick="S.sel=null;render()" style="margin-bottom:10px">← All submissions</button><h1>${esc(s.name)}</h1><p class="mu" style="margin-top:-8px">${esc(s.ws.title)} · ${fmt(s.ts)} · <span class="badge ${s.status==='Marked'?'b-m':'b-p'}">${s.status}</span></p>${body}
<div class="card"><h2>Grade and feedback</h2><p class="mu">Multiple-choice answers are pre-scored (${auto} correct). Add points for written answers.</p>
<label for="sc" class="q">Score out of ${total(s.ws)}</label><input type="number" id="sc" min="0" max="${total(s.ws)}" value="${sc}" style="max-width:140px">
<label for="fb" class="q" style="display:block;margin-top:14px">Feedback comment</label><textarea id="fb" placeholder="What went well, what to revisit">${esc(s.fb)}</textarea>
<div style="margin-top:14px"><button class="pri" onclick="saveGrade(${s.id})">Save grade</button></div></div>`}
async function saveGrade(id){if(!S.auth)return;const s=S.subs.find(x=>x.id===id),mx=total(s.ws),v=Number($('#sc').value);
if(isNaN(v)||v<0||v>mx){toast('Enter a score from 0 to '+mx);return}
try{const j=await api('grade',{id,score:v,fb:$('#fb').value});Object.assign(s,j.sub);S.sel=null;render();toast('Grade saved')}catch(e){toast('Could not save: '+e.message)}}
async function refresh(){await loadState();render();toast('Updated')}
setInterval(async()=>{if(S.auth&&S.tab==='dash'&&!S.sel&&!document.hidden){await loadState(true);if(S.auth&&S.tab==='dash'&&!S.sel)render()}},15000);
health();if(S.auth)loadState().then(()=>{S.tab=S.subs.some(x=>x.status!=='Marked')?'dash':'upload';render()});
render();
</script></body></html>
